name: Android TV app

on:
  push:
    paths:
      - 'androidtv/**'
      - '.github/workflows/androidtv.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: androidtv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: NetMoziTV-apk
          path: androidtv/app/build/outputs/apk/debug/*.apk
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NetMoziTV.apk
      # Stable link the Shield can download with the Downloader app.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: shield-latest
          name: NetMozi TV (latest build)
          body: Latest NetMozi TV build for NVIDIA Shield / Android TV. Install with the Downloader app or adb.
          files: androidtv/NetMoziTV.apk
          make_latest: true
